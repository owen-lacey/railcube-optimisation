name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The leaderboard Worker's URL (worker/), a repository variable. Without it
      # the builder would submit to the .env file's local Worker.
      - run: test -n "$PUBLIC_LEADERBOARD_URL"
        env:
          PUBLIC_LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
      - run: npm run build
        env:
          PUBLIC_LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
