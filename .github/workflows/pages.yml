name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way: an interrupted
# deploy can leave Pages serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both installs are needed. The site imports the model from the repo root
      # (../../src/track.js and friends), and the model imports cpsat-js — which
      # resolves from the ROOT node_modules, not the site's.
      - name: Install the model's dependencies
        run: npm ci

      - name: Install the site's dependencies
        run: npm ci
        working-directory: site

      # `enablement` turns Pages on via the API if it is not already, rather than
      # failing with "Get Pages site failed. Not Found" and making the first run
      # of this workflow a manual settings change. It needs `pages: write`, above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        working-directory: site
        env:
          # A project site is served from /<repo>/, not the domain root.
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
