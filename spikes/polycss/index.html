<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PolyCSS spike — composability + runtime movement</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; }
  body { display: grid; place-items: center; }
  poly-camera { width: 900px; height: 700px; display: block; }
  /* Glider test: does a CSS transition interpolate the library's transforms for free?
     The glider is the 6th mesh in source order → polycss-mesh-5. */
  [data-poly-mesh-index="polycss-mesh-5"], [data-poly-mesh-index="polycss-mesh-5"] * {
    transition: transform 1s linear;
  }
</style>
<script type="module" src="https://esm.sh/@layoutit/polycss/elements"></script>
</head>
<body>
<poly-camera rot-x="65" rot-y="45" zoom="2.5">
  <poly-scene directional-direction="0.5,-0.7,0.6" directional-intensity="1" ambient-intensity="0.5">
    <!-- Static "track": a row of cube pieces (position units = size units) -->
    <poly-box id="track-0" size="20" color="#ffd166" position="0,0,0"></poly-box>
    <poly-box id="track-1" size="20" color="#fca5a5" position="20,0,0"></poly-box>
    <poly-box id="track-2" size="20" color="#86efac" position="40,0,0"></poly-box>
    <poly-box id="track-3" size="20" color="#93c5fd" position="60,0,0"></poly-box>
    <!-- "Train": moved every animation frame via the position attribute -->
    <poly-box id="train" size="14" color="#f43f5e" position="0,0,20"></poly-box>
    <!-- "Glider": position jumps every 1.5s, CSS transition does the tweening -->
    <poly-box id="glider" size="14" color="#c084fc" position="0,40,0"></poly-box>
  </poly-scene>
</poly-camera>
<script>
  const train = document.getElementById('train');
  const stops = [[0,0,20],[20,0,20],[40,0,20],[60,0,20]];
  let t = 0;
  function tick() {
    t += 1 / 120;
    const lap = t % stops.length;
    const i = Math.floor(lap);
    const frac = lap - i;
    const a = stops[i], b = stops[(i + 1) % stops.length];
    const pos = a.map((v, k) => v + (b[k] - v) * frac);
    train.setAttribute('position', pos.join(','));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const glider = document.getElementById('glider');
  let flip = false;
  setInterval(() => {
    flip = !flip;
    glider.setAttribute('position', flip ? '60,40,0' : '0,40,0');
  }, 1500);
</script>
</body>
</html>
