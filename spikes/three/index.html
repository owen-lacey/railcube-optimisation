<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>three.js spike: the post's viewers through one renderer</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 4.5rem 16px 4rem; max-width: 640px; margin-inline: auto; font: 1.0625rem/1.65 system-ui, sans-serif; }
    p { margin: 0 0 1.25rem; }
    .viewer { position: relative; width: 100%; overflow: hidden; margin: 0 0 1.25rem; }
    .viewer canvas { display: block; width: 100%; height: 100%; }
    .cards { display: grid; grid-template-columns: repeat(3, 100px); gap: 12px; justify-content: center; margin: 0 0 1.25rem; }
    .cards .viewer { margin: 0; border: 2px solid #8884; border-radius: 0.5rem; }
    #hud { position: fixed; inset: 0 0 auto 0; z-index: 10; background: #111c; color: #fff; font: 12px/1.4 ui-monospace, monospace; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
    #hud button { font: inherit; padding: 2px 8px; border-radius: 4px; border: 1px solid #fff8; background: transparent; color: #fff; }
    #hud button[aria-pressed="true"] { background: #fff; color: #000; }
    #stats { flex-basis: 100%; white-space: pre; }
  </style>
</head>
<body>
  <div id="hud">
    <span>pr</span><span id="pr"></span>
    <span>trains</span><span id="trains"></span>
    <span>aa</span><span id="aa"></span>
    <span id="stats"></span>
  </div>
  <h1>Optimal Rail Cube</h1>
  <main id="post"></main>
  <script type="module" src="./main.js"></script>
</body>
</html>
