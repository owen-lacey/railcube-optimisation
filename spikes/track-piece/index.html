<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rail Cube — composed track pieces (PolyCSS POC)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; }
  body { display: grid; place-items: center; }
  poly-camera { width: 900px; height: 700px; display: block; }
</style>
</head>
<body>
<!--
  Rail Cube track pieces (docs/pieces.md), composed on the cell grid with poses
  from docs/coordinates.md. The rail is a channel recessed into the face, exactly
  as wide as the metal strip that forms its floor.

  Three views:
    (default)     a simple closed loop — a flat oblong, generated by chaining the
                  piece moves catalogued in docs/coordinates.md. The chain throws
                  unless the route closes and no two pieces share a cell, so the
                  two hard constraints hold by construction.
    ?scene=demo   the pre-loop illustration: a pose tour, not a legal track.
    ?poses=<type> one piece in all 24 valid poses (straight, cross, outsideCurve,
                  leftCurve, rightCurve, insideCurve).

  Axis mapping: project (x=right, y=up, z=forwards) → PolyCSS (X=right, Y=forwards, Z=up).
  Grid placement: PolyCSS position = cell × CUBE.

  Geometry is generated as Polygon[] chamfered cuboids (6 inset faces + 12 bevel strips
  + 8 corner triangles) and added to the declarative scene via sceneEl.getScene().add().
  PolyCSS shades each polygon by its normal, so the bevels read as moulded plastic edges.
  Building cuboids from raw vertices also sidesteps the poly-box scale X/Y swap gotcha.
-->
<poly-camera rot-x="65" rot-y="45" zoom="4" target="-40,30,0">
  <poly-scene id="scene" directional-direction="0.5,-0.7,0.6" directional-intensity="1" ambient-intensity="0.5">
    <poly-orbit-controls drag wheel></poly-orbit-controls>
  </poly-scene>
</poly-camera>
<script type="module">
  import 'https://esm.sh/@layoutit/polycss/elements';

  const CUBE = 20;
  const BEVEL = 1.5;      // chamfer width on the cube bodies
  const CHANNEL_W = 7;    // width of the rail channel sunk into the face
  const CHANNEL_D = 2;    // channel depth; must exceed BEVEL or the wall polygons degenerate
  const METAL = '#aab2bf';

  const RAIL = CUBE / 2 - CHANNEL_D; // the metal strip: how high the wheels ride

  // The train rides ON the track, not in it: only the wheels drop into the channel,
  // and the body clears the cube's surface. Heights are measured up from the rail.
  const TRAIN_W = 11;            // wider than the channel — the body overhangs the groove
  const TRAIN_L = 14;            // shorter than a cube, so one loco reads as one piece
  const TRAIN_H = 6;
  const TRAIN_BEVEL = 1;         // chamferedBox degenerates at bevel ≥ half the smallest side
  const TRAIN_CLEAR = 0.5;       // gap between the cube's surface and the body's underside
  const BODY_Z = CHANNEL_D + TRAIN_CLEAR; // underside height: clear of the surface above the rail
  const WHEEL_W = 5;             // narrower than the channel, so the wheels sit down in it
  const WHEEL_L = 3;
  const WHEEL_H = BODY_Z + 0.2;  // up to the body, overlapping it so no gap shows
  const WHEEL_INSET = 4;         // how far fore and aft of centre each wheel pair sits
  const TRAIN_COLOR = '#e63946';
  const WHEEL_COLOR = '#3f4653';

  // World (PolyCSS) direction of each project-frame letter:
  const DIR = { U: [0, 0, 1], D: [0, 0, -1], F: [0, 1, 0], B: [0, -1, 0], R: [1, 0, 0], L: [-1, 0, 0] };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

  // Pieces are grid cells in the project frame (x=right, y=up, z=forwards), each with
  // a pose from docs/coordinates.md: FACE the rail is on + HEADING of travel.

  // ---- Chaining a route into placed pieces --------------------------------
  // A track is written as a list of piece types and unrolled here. Each piece is
  // catalogued in the canonical UF pose (docs/coordinates.md, "What each piece
  // does"); entered in any other pose it is that same row rotated. Displacements
  // and footprint offsets are therefore held as *direction letters*, which rotate
  // by substitution — letters name physical directions, so they need no frame.
  const PROJ = { R: [1, 0, 0], L: [-1, 0, 0], U: [0, 1, 0], D: [0, -1, 0], F: [0, 0, 1], B: [0, 0, -1] };
  const OPPOSITE = { U: 'D', D: 'U', F: 'B', B: 'F', L: 'R', R: 'L' };

  // disp: where the next empty cell is. exit: the pose the next piece enters with.
  // foot: the cells the piece occupies, offsets from its own cell.
  const MOVES = {
    straight:     { disp: { F: 1 },       exit: 'UF', foot: [{}] },
    cross:        { disp: { F: 1 },       exit: 'UF', foot: [{}] },
    leftCurve:    { disp: { L: 2, F: 1 }, exit: 'UL', foot: [{}, { F: 1 }, { L: 1 }, { L: 1, F: 1 }] },
    rightCurve:   { disp: { R: 2, F: 1 }, exit: 'UR', foot: [{}, { F: 1 }, { R: 1 }, { R: 1, F: 1 }] },
    insideCurve:  { disp: { U: 2, F: 1 }, exit: 'BU', foot: [{}, { F: 1 }, { U: 1 }, { U: 1, F: 1 }] },
    outsideCurve: { disp: { D: 1 },       exit: 'FD', foot: [{}] },
  };

  const COLORS = {
    straight: '#ffd166',      // yellow
    cross: '#b48ce8',         // purple
    outsideCurve: '#ef6461',  // red
    leftCurve: '#6bbf59',     // green
    rightCurve: '#5b8def',    // blue
    insideCurve: '#f2933a',   // orange
  };
  const START_COLOR = '#f8fafc'; // the one white cube the set ships with

  // The same rotation poseRotation() builds, expressed as a letter → letter map:
  // local up lands on the pose's face, local forwards on its heading.
  function poseLetters(pose) {
    const right = cross(DIR[pose[1]], DIR[pose[0]]);
    const map = { U: pose[0], F: pose[1], R: Object.keys(DIR).find(k => DIR[k].every((v, i) => v === right[i])) };
    for (const k of ['U', 'F', 'R']) map[OPPOSITE[k]] = OPPOSITE[map[k]];
    return map;
  }

  // Sum a set of letter weights (e.g. {L: 2, F: 1}) into a project-frame delta,
  // rotating each letter through `map` on the way.
  const delta = (map, weights) => Object.entries(weights).reduce(
    (acc, [letter, n]) => acc.map((v, i) => v + n * PROJ[map[letter]][i]), [0, 0, 0]);

  // No two pieces may occupy the same cell — one of the two hard constraints.
  function assertNoCollisions(placed) {
    const owner = new Map();
    for (const { type, cells } of placed) {
      for (const cell of cells) {
        const key = cell.join(',');
        if (owner.has(key)) throw new Error(`collision at cell ${key}: ${owner.get(key)} and ${type}`);
        owner.set(key, type);
      }
    }
  }

  // Unroll a route into placed pieces, throwing unless it is a legal track. The
  // loop closes exactly when the head comes back to the start cell *and* pose —
  // returning with the wrong face or heading means the last piece cannot click
  // into the first.
  function chainTrack(route, startPose = 'UF') {
    let cell = [0, 0, 0], pose = startPose;
    const placed = route.map((type, i) => {
      const move = MOVES[type], map = poseLetters(pose);
      const piece = {
        cell, pose, type,
        color: i === 0 ? START_COLOR : COLORS[type],
        cells: move.foot.map(offset => delta(map, offset).map((v, k) => v + cell[k])),
      };
      cell = cell.map((v, k) => v + delta(map, move.disp)[k]);
      pose = map[move.exit[0]] + map[move.exit[1]];
      return piece;
    });
    if (cell.some(v => v !== 0) || pose !== startPose) {
      throw new Error(`route does not close: head at ${cell.join(',')} pose ${pose}, wanted 0,0,0 ${startPose}`);
    }
    assertNoCollisions(placed);
    return placed;
  }

  // Default view — a simple closed loop, flat on the ground: four straights up
  // each long side, one across each short side, a green left curve at each
  // corner. 14 pieces (10 straight + 4 curve), inside the starter set's 15 + 8.
  // Long sides are four cubes so a train has a real run before the first bend.
  const loopRoute = [
    'straight', 'straight', 'straight', 'straight', 'leftCurve', // near side, then turn left
    'straight', 'leftCurve',                                     // far short side
    'straight', 'straight', 'straight', 'straight', 'leftCurve', // back down the far side
    'straight', 'leftCurve',                                     // near short side, closing on the start
  ];
  const loopPieces = chainTrack(loopRoute);

  // ?scene=inversion — the complete tour: one closed loop that puts the rail on
  // all six faces of a cube, so the train runs along the top, climbs both side
  // walls, crosses the front and the back, and hangs upside down underneath.
  // Reaching the left and right faces is what forces the horizontal turns: a loop
  // that only climbs and inverts stays in a single vertical plane and can never
  // touch more than four faces. The rail visits the faces in this order —
  //
  //   U U U R U L L L B R R D D F
  //
  // 2 straights, 4 left curves, 4 inside curves and 4 outside curves: every
  // inside and every outside curve the starter set ships with. Found by exhaustive
  // search over the piece catalogue — no closed loop of fewer than 12 pieces
  // reaches all six faces at all, and of the 14-piece ones this is the most
  // compact, 38 cubes inside a 5×4×5 box.
  const inversionRoute = [
    'straight', 'leftCurve', 'insideCurve',                  // along the ground, turn, climb
    'outsideCurve', 'outsideCurve', 'leftCurve',             // over the crest onto the left wall
    'straight', 'outsideCurve', 'outsideCurve', 'leftCurve', // across the back at ground level
    'insideCurve', 'leftCurve',                              // up again and over the top
    'insideCurve', 'insideCurve',                            // upside down, then down to the start
  ];
  const inversionPieces = chainTrack(inversionRoute);

  // ?scene=demo — the pre-loop illustration, kept for the blog: NOT a legal
  // track, just a tour of the pose system with a ground run, a wall climb up the
  // far column, a crest onto its roof, and three loose pieces beside it.
  const demoScene = [
    { cell: [0, 0, 0], type: 'straight', pose: 'UF', color: '#f8fafc' }, // start cube — white
    { cell: [0, 0, 1], type: 'straight', pose: 'UF', color: '#ffd166' },
    { cell: [0, 0, 2], type: 'cross', pose: 'UF', color: '#b48ce8' }, // crossing — purple
    { cell: [0, 0, 3], type: 'straight', pose: 'UF', color: '#ffd166' },
    { cell: [0, 0, 4], type: 'straight', pose: 'FU', color: '#ffd166' }, // wall column: rail on front face, heading up
    { cell: [0, 1, 4], type: 'straight', pose: 'FU', color: '#ffd166' },
    { cell: [0, 2, 4], type: 'straight', pose: 'FU', color: '#ffd166' },
    { cell: [0, 3, 4], type: 'outsideCurve', pose: 'FU', color: '#ef6461' }, // red — crests the wall onto its top
    { cell: [0, 3, 3], type: 'straight', pose: 'UB', color: '#ffd166' }, // on the roof, heading back towards the viewer
    // Four left curves click into the free-standing donut ring from the
    // product photos (docs/coordinates.md sanity check: displacements sum to
    // zero and the 2×2 footprints tile a 4×4 square).
    { cell: [4, 0, 0], type: 'leftCurve', pose: 'UF', color: '#6bbf59' },
    { cell: [2, 0, 1], type: 'leftCurve', pose: 'UL', color: '#6bbf59' },
    { cell: [1, 0, -1], type: 'leftCurve', pose: 'UB', color: '#6bbf59' },
    { cell: [3, 0, -2], type: 'leftCurve', pose: 'UR', color: '#6bbf59' },
    { cell: [-2, 0, 3], type: 'rightCurve', pose: 'UF', color: '#5b8def' }, // blue — standalone
    { cell: [-2, 0, 0], type: 'insideCurve', pose: 'UF', color: '#f2933a' }, // orange — valley turn, ground to wall
  ];

  // ?poses=<type> view — the full catalogue: one piece in each of the 24 valid poses.
  // One row per face (U D F B L R), one column per heading, two cells apart.
  const params = new URLSearchParams(location.search);
  const galleryType = params.get('poses') || 'straight';
  const FACES = ['U', 'D', 'F', 'B', 'L', 'R'];
  const gap = ['leftCurve', 'rightCurve', 'insideCurve'].includes(galleryType) ? 4 : 2; // arcs span 2×2 cells
  const galleryPieces = FACES.flatMap((face, row) =>
    FACES.filter(h => DIR[h].every((v, k) => v === 0 || DIR[face][k] === 0))
      .map((heading, col) => ({
        cell: [col * gap, 0, -row * gap],
        type: galleryType,
        pose: face + heading,
        color: '#ffd166',
      })));

  // The views, keyed by ?scene= name. `camera` holds only the camera attributes
  // this scene overrides — the loop keeps every default in the markup, and a
  // target is the world-space centre of the pieces' bounding box. `drive` marks
  // the scenes that are a real route, and so can have a train run on them: the
  // demo is loose pieces and the gallery is a catalogue, neither of them a track.
  const gallery = params.has('poses');
  const SCENES = {
    loop: { pieces: loopPieces, drive: true },
    // A compact 3D tangle rather than a flat layout: the view swings round behind
    // it, where the two interlocking rings read as separate instead of overlapping.
    inversion: {
      pieces: inversionPieces, drive: true,
      camera: { zoom: 7.5, target: '-40,0,30', 'rot-x': 60, 'rot-y': 225 },
    },
    demo: { pieces: demoScene, camera: { zoom: 2.8, target: '20,30,25' } },
    poses: { pieces: galleryPieces, camera: { zoom: 4.4 / gap, target: `${30 * gap},${-50 * gap},0` } },
  };
  const sceneName = gallery ? 'poses' : params.get('scene') || 'loop';
  const active = SCENES[sceneName];
  if (!active) throw new Error(`unknown scene ${sceneName}`);
  if (active.camera) {
    const cam = document.querySelector('poly-camera');
    for (const [attr, value] of Object.entries(active.camera)) cam.setAttribute(attr, String(value));
  }

  const toWorld = ([x, y, z]) => [x * CUBE, z * CUBE, y * CUBE]; // project → PolyCSS swap

  // Pose → rotation. A piece is authored in the canonical UF pose (rail on the up
  // face, heading forwards). The rotation maps local up onto the pose's face
  // direction and local forwards onto its heading; the third axis follows from
  // right-handedness.
  function poseRotation(pose) {
    const [face, heading] = [DIR[pose[0]], DIR[pose[1]]];
    if (face.some((v, k) => Math.abs(v) === Math.abs(heading[k]) && v !== 0)) {
      throw new Error(`invalid pose ${pose}: heading must be perpendicular to face`);
    }
    return [cross(heading, face), heading, face]; // images of local X, Y (forwards), Z (up)
  }
  const rotate = (polys, [mx, my, mz]) =>
    polys.map(p => ({ ...p, vertices: p.vertices.map(([x, y, z]) =>
      [x * mx[0] + y * my[0] + z * mz[0], x * mx[1] + y * my[1] + z * mz[1], x * mx[2] + y * my[2] + z * mz[2]]) }));

  // Orient a polygon so its normal points away from the local origin.
  const oriented = vs => {
    const [p, q, r] = vs;
    const u = q.map((v, k) => v - p[k]), w = r.map((v, k) => v - p[k]);
    const n = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]];
    const c = vs.reduce((acc, v) => acc.map((x, k) => x + v[k] / vs.length), [0, 0, 0]);
    return n[0] * c[0] + n[1] * c[1] + n[2] * c[2] < 0 ? [...vs].reverse() : vs;
  };

  // Chamfered cuboid centred on local origin: sizes [sx, sy, sz], bevel width b.
  // 6 inset faces + 12 bevel strips + 8 corner triangles = 26 polygons.
  function chamferedBox([sx, sy, sz], b, color) {
    const h = [sx / 2, sy / 2, sz / 2];       // half extents (face planes)
    const i = h.map(v => v - b);              // inset extents (face borders)
    const polys = [];

    // A vertex on the chamfered hull: corner signs [s0,s1,s2], with axis `flat`
    // pushed out to the face plane and the other two pulled in to the inset.
    const vert = (signs, flat) =>
      signs.map((s, a) => s * (a === flat ? h[a] : i[a]));

    const add = vs => polys.push({ vertices: oriented(vs), color });

    for (const s of [-1, 1]) {
      for (let a = 0; a < 3; a++) {
        // Face on axis a, side s: inset square walked corner-to-corner.
        const [u, v] = [(a + 1) % 3, (a + 2) % 3];
        add([[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([su, sv]) => {
          const signs = []; signs[a] = s; signs[u] = su; signs[v] = sv;
          return vert(signs, a);
        }));
        // Corner triangles for the 4 corners on side s of axis 0 (done once, a === 0).
        if (a === 0) for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
          const signs = [s, s1, s2];
          add([vert(signs, 0), vert(signs, 1), vert(signs, 2)]);
        }
      }
    }
    // 12 bevel strips: one per edge, between the borders of its two adjacent faces.
    for (let a = 0; a < 3; a++) {                    // a = axis the edge runs along
      const [u, v] = [(a + 1) % 3, (a + 2) % 3];
      for (const su of [-1, 1]) for (const sv of [-1, 1]) {
        const at = (se, flat) => {
          const signs = []; signs[a] = se; signs[u] = su; signs[v] = sv;
          return vert(signs, flat);
        };
        add([at(-1, u), at(1, u), at(1, v), at(-1, v)]);
      }
    }
    return polys;
  }

  // A track cube: chamfered cube with a channel sunk into the top face, running
  // forwards edge-to-edge (matching the real piece, where the rail is recessed).
  // Surgery on the chamferedBox hull: drop the top face, the two top bevel strips
  // the channel crosses, and the front/back faces; re-add them split around the
  // channel opening, then add the channel walls and floor.
  function channeledCube(color) {
    const h = CUBE / 2, i = h - BEVEL;
    const wc = CHANNEL_W / 2, floor = h - CHANNEL_D;
    const eq = (a, b) => Math.abs(a - b) < 1e-6;
    // Every removed polygon lies entirely in {z = top} ∪ {|y| = front/back}.
    const polys = chamferedBox([CUBE, CUBE, CUBE], BEVEL, color)
      .filter(p => !p.vertices.every(([x, y, z]) => eq(z, h) || eq(Math.abs(y), h)));
    const add = vs => polys.push({ vertices: oriented(vs), color });

    for (const s of [-1, 1]) {
      const x0 = s * wc, x1 = s * i;
      add([[x0, -i, h], [x1, -i, h], [x1, i, h], [x0, i, h]]);            // top face half
      for (const sy of [-1, 1]) {
        add([[x0, sy * i, h], [x1, sy * i, h], [x1, sy * h, i], [x0, sy * h, i]]); // top bevel segment
        add([[s * i, sy * h, -i], [x0, sy * h, -i], [x0, sy * h, i], [s * i, sy * h, i]]); // face side rect
      }
      add([[-wc, s * h, -i], [wc, s * h, -i], [wc, s * h, floor], [-wc, s * h, floor]]); // face below channel
      // Channel wall at x = s·wc, normal facing INTO the channel (so `oriented`,
      // which points away from the origin, is wrong here — wind it by hand).
      const wall = [
        [s * wc, -h, floor], [s * wc, -h, i], [s * wc, -i, h],
        [s * wc, i, h], [s * wc, h, i], [s * wc, h, floor],
      ];
      polys.push({ vertices: s > 0 ? wall : [...wall].reverse(), color });
    }
    // Channel floor IS the metal rail: the channel is exactly as wide as the strip,
    // so the exposed floor is the strip's upper surface.
    polys.push({
      vertices: oriented([[-wc, -h, floor], [wc, -h, floor], [wc, h, floor], [-wc, h, floor]]),
      color: METAL,
    });
    return polys;
  }

  // Wind a hand-built polygon so its normal points along dir (for faces whose
  // normal direction `oriented`'s away-from-origin heuristic gets wrong).
  const windToward = (vs, dir) => {
    const [p, q, r] = vs;
    const u = q.map((v, k) => v - p[k]), w = r.map((v, k) => v - p[k]);
    const n = cross(u, w);
    return n[0] * dir[0] + n[1] * dir[1] + n[2] * dir[2] < 0 ? [...vs].reverse() : vs;
  };

  // The cross piece: two straight channels crossing at right angles on the top
  // face — one running forwards (cutting front/back, as on the straight), one
  // running left–right (cutting left/right). Same surgery as channeledCube but
  // fourfold: all four side faces and top bevels split around an opening, each
  // channel wall interrupted where the other channel crosses it, and the two
  // floors merging into one plus-shaped metal strip.
  function crossCube(color) {
    const h = CUBE / 2, i = h - BEVEL;
    const wc = CHANNEL_W / 2, floor = h - CHANNEL_D;
    const eq = (a, b) => Math.abs(a - b) < 1e-6;
    // Remove the top face (4 top vertices), all four top bevels (2 top
    // vertices), and all four side faces; corner triangles (1 top vertex),
    // vertical bevels and everything below survive.
    const polys = chamferedBox([CUBE, CUBE, CUBE], BEVEL, color).filter(p => {
      const topCount = p.vertices.filter(v => eq(v[2], h)).length;
      const isFace = a => p.vertices.every(v => eq(Math.abs(v[a]), h));
      return topCount < 2 && !isFace(0) && !isFace(1);
    });
    const add = vs => polys.push({ vertices: oriented(vs), color });

    // Top face: the four corner squares left between the two channel openings.
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      add([[sx * wc, sy * wc, h], [sx * i, sy * wc, h], [sx * i, sy * i, h], [sx * wc, sy * i, h]]);
    }
    // Both channels are the same shape rotated 90°: build one running
    // forwards (cutting the front/back faces), then the same with x/y swapped.
    const channel = swapXY => {
      const m = ([x, y, z]) => swapXY ? [y, x, z] : [x, y, z];
      for (const sy of [-1, 1]) {
        add([m([-wc, sy * h, -i]), m([wc, sy * h, -i]), m([wc, sy * h, floor]), m([-wc, sy * h, floor])]); // face below channel
        for (const s of [-1, 1]) {
          add([m([s * i, sy * h, -i]), m([s * wc, sy * h, -i]), m([s * wc, sy * h, i]), m([s * i, sy * h, i])]); // face side rect
          add([m([s * wc, sy * i, h]), m([s * i, sy * i, h]), m([s * i, sy * h, i]), m([s * wc, sy * h, i])]);   // top bevel segment
          // Channel wall at ±wc, stopping where the crossing channel cuts
          // through it — a pentagon per quadrant, facing INTO the channel.
          const pent = [
            [s * wc, sy * h, floor], [s * wc, sy * h, i], [s * wc, sy * i, h],
            [s * wc, sy * wc, h], [s * wc, sy * wc, floor],
          ].map(m);
          polys.push({ vertices: windToward(pent, m([-s, 0, 0])), color });
        }
      }
    };
    channel(false);
    channel(true);
    // The metal floor: both channels share the same depth, so the two strips
    // merge into a plus shape — centre square plus four arms. (Five convex
    // rects, not one 12-gon: PolyCSS renders concave polygons wrongly.)
    const rect = (x0, x1, y0, y1) => polys.push({
      vertices: windToward([[x0, y0, floor], [x1, y0, floor], [x1, y1, floor], [x0, y1, floor]], [0, 0, 1]),
      color: METAL,
    });
    rect(-wc, wc, -wc, wc);
    rect(-wc, wc, wc, h); rect(-wc, wc, -h, -wc);   // forwards/backwards arms
    rect(wc, h, -wc, wc); rect(-h, -wc, -wc, wc);   // right/left arms
    return polys;
  }

  // The outside curve: single cube whose whole top-front edge is rounded off
  // (matching the physical piece), the channel wrapping over the rounding —
  // in from the back edge across the top, over the crest, down the front and
  // out through the bottom edge (canonical UF entry → FD exit, next cube
  // directly underneath). Around the edge everything is concentric arcs about
  // the same centre: the hull rounding at EDGE_R, its chamfer band at
  // EDGE_R − BEVEL (which lands exactly on the side faces' inset boundary),
  // and the metal floor at EDGE_R − CHANNEL_D.
  const EDGE_R = 13;            // radius the top-front edge is rounded off to
  const OUT_C = CUBE / 2 - EDGE_R; // its arc centre (y, z) = (c, c); flat faces end here
  function outsideCurve(color) {
    const h = CUBE / 2, i = h - BEVEL;
    const wc = CHANNEL_W / 2, floor = h - CHANNEL_D;
    const eq = (a, b) => Math.abs(a - b) < 1e-6;
    const NE = 8;               // facets per quarter turn
    const c = OUT_C;
    const arcPts = r => Array.from({ length: NE + 1 }, (_, j) => {
      const t = (j / NE) * Math.PI / 2;
      return [c + r * Math.sin(t), c + r * Math.cos(t)]; // (y, z), top → front
    });
    const H = arcPts(EDGE_R), Hb = arcPts(EDGE_R - BEVEL), F = arcPts(EDGE_R - CHANNEL_D);

    // Hull surgery: remove every polygon the channel or the rounding touches —
    // all six faces except we keep nothing of top/back/front/bottom/sides
    // outright removed below, plus the bevels along the affected edges and
    // the two top-front corner triangles.
    const polys = chamferedBox([CUBE, CUBE, CUBE], BEVEL, color).filter(p => {
      const cnt = f => p.vertices.filter(f).length;
      const all = f => p.vertices.every(f);
      const top = cnt(v => eq(v[2], h)), bot = cnt(v => eq(v[2], -h));
      const front = cnt(v => eq(v[1], h)), backOrFront = cnt(v => eq(Math.abs(v[1]), h));
      const side = cnt(v => eq(Math.abs(v[0]), h));
      return !(all(v => eq(v[2], h)) || all(v => eq(v[2], -h))
        || all(v => eq(Math.abs(v[1]), h)) || all(v => eq(Math.abs(v[0]), h))
        || (top >= 2 && backOrFront >= 2)  // back-top bevel (front-top too)
        || (bot >= 2 && front >= 2)        // front-bottom bevel
        || (top >= 2 && side >= 2)         // side-top bevels
        || (front >= 2 && side >= 2)       // side-front bevels
        || (top >= 1 && front >= 1));      // top-front corner triangles
    });
    const add = vs => polys.push({ vertices: oriented(vs), color });

    add([[-wc, -h, -i], [wc, -h, -i], [wc, -h, floor], [-wc, -h, floor]]); // back face below channel
    add([[-i, -i, -h], [i, -i, -h], [i, floor, -h], [-i, floor, -h]]);     // bottom face short of the exit mouth
    for (const s of [-1, 1]) {
      add([[s * wc, -i, h], [s * i, -i, h], [s * i, c, h], [s * wc, c, h]]);       // top face strip, to the rounding
      add([[s * i, -h, -i], [s * wc, -h, -i], [s * wc, -h, i], [s * i, -h, i]]);   // back face side rect
      add([[s * i, h, -i], [s * wc, h, -i], [s * wc, h, c], [s * i, h, c]]);       // front face strip, to the rounding
      add([[s * wc, -i, h], [s * i, -i, h], [s * i, -h, i], [s * wc, -h, i]]);     // back-top bevel segment
      add([[s * wc, h, -i], [s * i, h, -i], [s * i, i, -h], [s * wc, i, -h]]);     // front-bottom bevel segment
      add([[s * wc, floor, -h], [s * i, floor, -h], [s * i, i, -h], [s * wc, i, -h]]); // bottom face beside exit mouth
      add([[s * i, -i, h], [s * i, c, h], [s * h, c, i], [s * h, -i, i]]);         // side-top bevel, stops at the rounding
      add([[s * i, h, -i], [s * i, h, c], [s * h, i, c], [s * h, i, -i]]);         // side-front bevel, stops at the rounding
      // Side face with its top-front corner following the rounding's chamfer.
      add([[-i, i], ...Hb, [i, -i], [-i, -i]].map(([y, z]) => [s * h, y, z]));
      // The rounded edge itself and its chamfer band down to the side face.
      for (let j = 0; j < NE; j++) {
        add([[s * wc, ...H[j]], [s * i, ...H[j]], [s * i, ...H[j + 1]], [s * wc, ...H[j + 1]]]);
        add([[s * i, ...H[j]], [s * h, ...Hb[j]], [s * h, ...Hb[j + 1]], [s * i, ...H[j + 1]]]);
      }
      // Channel wall at x = ±wc: flat slabs fore and aft of the corner, then
      // radial strips between the floor arc and the hull arc.
      const wall = vs => polys.push({
        vertices: windToward(vs.map(([y, z]) => [s * wc, y, z]), [-s, 0, 0]),
        color,
      });
      wall([[-h, floor], [c, floor], [c, h], [-i, h], [-h, i]]);   // top-back slab
      wall([[floor, c], [floor, -h], [i, -h], [h, -i], [h, c]]);   // front slab
      for (let j = 0; j < NE; j++) wall([F[j], F[j + 1], H[j + 1], H[j]]);
    }
    // The metal floor: flat top run, arc facets over the crest, flat front run.
    const fl = [[-h, floor], ...F, [floor, -h]];
    for (let k = 0; k < fl.length - 1; k++) {
      const [[y0, z0], [y1, z1]] = [fl[k], fl[k + 1]];
      polys.push({
        vertices: oriented([[-wc, y0, z0], [wc, y0, z0], [wc, y1, z1], [-wc, y1, z1]]),
        color: METAL,
      });
    }
    return polys;
  }

  // ---- Arc pieces: quarter-donut bodies built by profile sweep -------------
  // The cross-section perpendicular to travel — a chamfered square with the
  // channel notch cut into the w = +h side — is placed at SEGMENTS+1 stations
  // along a quarter arc and neighbouring stations are stitched with quads.
  // u = transverse (canonical right), w = the side the channel faces.
  // Traversal order is chosen so swept quads wind outward; the channel-floor
  // edge is the metal strip.
  const SEGMENTS = 8;
  const ARC_R = 1.5 * CUBE; // centreline radius; body spans CUBE..2·CUBE
  // Two pieces that click together have to look like two pieces. A cube's
  // chamfered edges leave a groove 2·BEVEL wide at every join; a swept body has
  // no such edge, so it stops BEVEL short of each mouth to leave the same groove.
  // The metal strip still runs the full arc, bridging the groove exactly as it
  // runs straight across a cube-to-cube join, so the wheels never cross a gap.
  const SEAM = BEVEL / ARC_R; // the arc angle worth BEVEL of travel
  const PROFILE = (() => {
    const h = CUBE / 2, i = h - BEVEL, wc = CHANNEL_W / 2, floor = h - CHANNEL_D;
    return {
      pts: [
        [wc, h], [i, h], [h, i], [h, -i], [i, -h], [-i, -h],
        [-h, -i], [-h, i], [-i, h], [-wc, h], [-wc, floor], [wc, floor],
      ],
      metalEdge: 10, // (-wc, floor) → (wc, floor): the channel floor
      // End caps are the profile's area — concave (the notch), so decomposed
      // into three convex pieces: the columns either side of the channel and
      // the slab underneath it. (PolyCSS renders concave polygons wrongly.)
      caps: [
        [[-wc, h], [-i, h], [-h, i], [-h, -i], [-i, -h], [-wc, -h]],
        [[wc, h], [wc, -h], [i, -h], [h, -i], [h, i], [i, h]],
        [[-wc, floor], [-wc, -h], [wc, -h], [wc, floor]],
      ],
    };
  })();

  // Sweep the profile along a quarter arc. `map(u, w, θ)` places a profile
  // point at station θ ∈ [0, π/2]; the piece's centreline — the future train
  // path — is map(0, floor, θ). Entry/exit caps face along entryDir/exitDir.
  function sweepPiece(map, color, entryDir, exitDir) {
    const polys = [];
    const body = j => SEAM + (j / SEGMENTS) * (Math.PI / 2 - 2 * SEAM);
    const strip = j => (j / SEGMENTS) * Math.PI / 2;
    for (let j = 0; j < SEGMENTS; j++) {
      PROFILE.pts.forEach(([u0, w0], k) => {
        const [u1, w1] = PROFILE.pts[(k + 1) % PROFILE.pts.length];
        const metal = k === PROFILE.metalEdge;
        const [t0, t1] = metal ? [strip(j), strip(j + 1)] : [body(j), body(j + 1)];
        polys.push({
          vertices: [map(u0, w0, t0), map(u1, w1, t0), map(u1, w1, t1), map(u0, w0, t1)],
          color: metal ? METAL : color,
        });
      });
    }
    for (const [t, dir] of [[body(0), entryDir], [body(SEGMENTS), exitDir]]) {
      for (const cap of PROFILE.caps) {
        polys.push({ vertices: windToward(cap.map(([u, w]) => map(u, w, t)), dir), color });
      }
    }
    return polys;
  }

  // The two sweep maps, shared by the geometry below and by the train's path:
  // left curve is a flat quarter arc across the 2×2 ground footprint, arc centre
  // at the footprint's far-left corner, rail staying on top (w → z); inside curve
  // is the same donut stood upright, w pointing towards the arc centre.
  const ARC_MAP = {
    leftCurve: (u, w, t) =>
      [-ARC_R + (ARC_R + u) * Math.cos(t), -CUBE / 2 + (ARC_R + u) * Math.sin(t), w],
    insideCurve: (u, w, t) =>
      [u, -CUBE / 2 + (ARC_R - w) * Math.sin(t), ARC_R - (ARC_R - w) * Math.cos(t)],
  };

  function leftCurve(color) {
    return sweepPiece(ARC_MAP.leftCurve, color, [0, -1, 0], [-1, 0, 0]);
  }
  // Right curve: the left curve mirrored (reversing winding to keep normals out).
  const mirrorX = polys => polys.map(p => ({
    ...p, vertices: p.vertices.map(([x, y, z]) => [-x, y, z]).reverse(),
  }));
  const rightCurve = color => mirrorX(leftCurve(color));

  // Inside curve: the same quarter donut stood in the vertical plane, channel
  // on the concave face (w → towards the arc centre, up-and-over the valley).
  function insideCurve(color) {
    return sweepPiece(ARC_MAP.insideCurve, color, [0, -1, 0], [0, 0, 1]);
  }

  // Geometry generator per piece type, all authored in the canonical UF pose.
  const GEOMETRY = {
    straight: channeledCube,
    cross: crossCube,
    outsideCurve,
    leftCurve,
    rightCurve,
    insideCurve,
  };

  const translate = (polys, [tx, ty, tz]) =>
    polys.map(p => ({ ...p, vertices: p.vertices.map(([x, y, z]) => [x + tx, y + ty, z + tz]) }));

  await customElements.whenDefined('poly-scene');
  const scene = document.getElementById('scene').getScene();

  for (const { cell, type, pose, color } of active.pieces) {
    const polygons = translate(rotate(GEOMETRY[type](color), poseRotation(pose)), toWorld(cell));
    scene.add({ polygons, objectUrls: [], warnings: [], dispose: () => {} }, {});
  }

  // ---- Where the rail runs through each piece -----------------------------
  // railMap(u, w, s) is the point `u` to the right of the rail and `w` above it,
  // `s` of the way through the piece (0 at the entry mouth, 1 at the exit), in
  // the piece's canonical UF frame. The curves reuse the very sweep maps their
  // geometry is built from, so the train cannot drift off the metal strip.
  const OUT_RF = EDGE_R - CHANNEL_D;                  // rail radius round the rounded edge
  const OUT_LEGS = [CUBE / 2 + OUT_C, OUT_RF * Math.PI / 2]; // flat top run, then the arc
  const OUT_LEN = 2 * OUT_LEGS[0] + OUT_LEGS[1];      // the front run is the same as the top

  const RAIL_MAPS = {
    straight: (u, w, s) => [u, -CUBE / 2 + s * CUBE, RAIL + w],
    cross: (u, w, s) => [u, -CUBE / 2 + s * CUBE, RAIL + w],
    leftCurve: (u, w, s) => ARC_MAP.leftCurve(u, RAIL + w, s * Math.PI / 2),
    // The right curve is the left one mirrored, so mirror the rail with it.
    rightCurve: (u, w, s) => {
      const [x, y, z] = ARC_MAP.leftCurve(-u, RAIL + w, s * Math.PI / 2);
      return [-x, y, z];
    },
    insideCurve: (u, w, s) => ARC_MAP.insideCurve(u, RAIL + w, s * Math.PI / 2),
    // Three legs measured by distance travelled: across the top, over the
    // rounded edge, then down the front face.
    outsideCurve: (u, w, s) => {
      const [flat, arc] = OUT_LEGS, d = s * OUT_LEN;
      if (d <= flat) return [u, -CUBE / 2 + d, RAIL + w];
      if (d <= flat + arc) {
        const t = (d - flat) / OUT_RF;
        return [u, OUT_C + (OUT_RF + w) * Math.sin(t), OUT_C + (OUT_RF + w) * Math.cos(t)];
      }
      return [u, RAIL + w, OUT_C - (d - flat - arc)];
    },
  };

  const sub = (a, b) => a.map((v, k) => v - b[k]);
  const add = (a, b) => a.map((v, k) => v + b[k]);
  const len = a => Math.hypot(...a);
  const unit = a => { const n = len(a); return a.map(v => v / n); };
  // Send a local direction or point through a pose's rotation (as `rotate` does).
  const through = ([mx, my, mz], [x, y, z]) =>
    [0, 1, 2].map(k => x * mx[k] + y * my[k] + z * mz[k]);

  // Where the train sits, and which way it faces, part-way through a piece: the
  // heading comes from stepping along the rail, the up direction from stepping
  // away from it. The step straddles s even at the mouths — every rail map keeps
  // going past its own ends, and a one-sided step would read a curve's chord
  // instead of its tangent, kinking the train at each join.
  function railFrame(type, s) {
    const map = RAIL_MAPS[type];
    if (!map) throw new Error(`no rail path for piece type ${type}`);
    const e = 1e-3;
    const pos = map(0, 0, s);
    return {
      pos,
      fwd: unit(sub(map(0, 0, s + e), map(0, 0, s - e))),
      up: unit(sub(map(0, 1, s), pos)),
    };
  }

  // Every piece's rail must run from the centre of its entry mouth to the centre
  // of the next piece's, arriving with the face and heading the piece's exit pose
  // promises — otherwise a train would jump or twist at the join. Checked against
  // the displacement table in MOVES, so the two can never drift apart.
  function assertRailMouths() {
    const MOUTH = [0, -CUBE / 2, RAIL];
    for (const [type, move] of Object.entries(MOVES)) {
      const exit = poseRotation(move.exit);
      const want = {
        pos: add(toWorld(delta(poseLetters('UF'), move.disp)), through(exit, MOUTH)),
        fwd: DIR[move.exit[1]],
        up: DIR[move.exit[0]],
      };
      const ends = { 0: { pos: MOUTH, fwd: DIR.F, up: DIR.U }, 1: want };
      for (const [s, expected] of Object.entries(ends)) {
        const got = railFrame(type, Number(s));
        for (const k of ['pos', 'fwd', 'up']) {
          if (len(sub(got[k], expected[k])) > 1e-6) {
            throw new Error(`${type} rail ${k} at s=${s}: got ${got[k]}, wanted ${expected[k]}`);
          }
        }
      }
    }
  }
  assertRailMouths();

  // Walk a chained route and sample the whole rail as one polyline in scene
  // space. Each piece contributes `samples` points from its entry mouth up to
  // (not including) its exit, where the next piece takes over — so on a closed
  // loop the polyline closes too.
  function trackPath(placed, samples = 24) {
    return placed.flatMap(({ cell, type, pose }) => {
      const basis = poseRotation(pose), origin = toWorld(cell);
      return Array.from({ length: samples }, (_, k) => {
        const { pos, fwd, up } = railFrame(type, k / samples);
        return {
          pos: add(through(basis, pos), origin),
          fwd: through(basis, fwd),
          up: through(basis, up),
        };
      });
    });
  }

  // ---- The train ----------------------------------------------------------
  // A body riding above the track on two pairs of wheels — only the wheels drop
  // into the channel. Authored with its origin at the point where the wheels meet
  // the rail, facing forwards, so it can be dropped straight onto a rail sample.
  function trainBody() {
    return [
      ...translate(chamferedBox([TRAIN_W, TRAIN_L, TRAIN_H], TRAIN_BEVEL, TRAIN_COLOR),
        [0, 0, BODY_Z + TRAIN_H / 2]),
      ...[-WHEEL_INSET, WHEEL_INSET].flatMap(y =>
        translate(chamferedBox([WHEEL_W, WHEEL_L, WHEEL_H], 0.6, WHEEL_COLOR),
          [0, y, 0.05 + WHEEL_H / 2])), // a hair above the strip, so the two never z-fight
    ];
  }

  // Returns `place(position, basis)`: the position rides in the mesh transform
  // (updated in place, cheap), while turning re-supplies rotated polygons —
  // mesh rotation is Euler degrees in an undocumented order, whereas stableDom
  // swaps geometry without a remount.
  function addTrain() {
    const body = trainBody();
    const handle = scene.add(
      { polygons: body, objectUrls: [], warnings: [], dispose: () => {} }, {});
    return (position, basis) => {
      handle.setPolygons(rotate(body, basis), { stableDom: true });
      handle.setTransform({ position });
    };
  }

  // Drive the train round the loop at a steady speed. Between two rail samples
  // both the heading and the up direction are blended and squared back up, so
  // the train leans into the corners instead of snapping between facets.
  function runTrain(placed) {
    const path = trackPath(placed);
    const gaps = path.map((p, k) => len(sub(path[(k + 1) % path.length].pos, p.pos)));
    const lap = gaps.reduce((a, b) => a + b, 0);
    const SPEED = 40; // scene units per second — two cubes a second
    const place = addTrain();

    let k = 0, travelled = 0; // travelled = distance to the start of sample k
    requestAnimationFrame(function tick(now) {
      let d = (now / 1000 * SPEED) % lap;
      if (d < travelled) { k = 0; travelled = 0; } // lapped: back to the start
      while (d - travelled >= gaps[k]) { travelled += gaps[k]; k = (k + 1) % path.length; }

      const a = path[k], b = path[(k + 1) % path.length], f = (d - travelled) / gaps[k];
      const blend = (p, q) => p.map((v, i) => v + (q[i] - v) * f);
      const fwd = unit(blend(a.fwd, b.fwd));
      const raw = blend(a.up, b.up);
      const dot = raw.reduce((acc, v, i) => acc + v * fwd[i], 0);
      const up = unit(raw.map((v, i) => v - dot * fwd[i])); // square up against the heading
      place(blend(a.pos, b.pos), [cross(fwd, up), fwd, up]);
      requestAnimationFrame(tick);
    });
  }

  if (active.drive) runTrain(active.pieces);
</script>
